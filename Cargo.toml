[package]
name = "vidcapture"
version = "0.3.0"
edition = "2024"
description = "Cross-platform CLI to record screen and audio, cut videos precisely, and add timed text labels with ffmpeg."
license = "MIT"
repository = "https://github.com/elvisbrevi/vidcapture"
homepage = "https://vidcapture.elvisbrevi.cl"
authors = ["Elvis Brevi <elvisbrevi@gmail.com>"]
keywords = ["screen-recording", "ffmpeg", "cross-platform", "cli", "video"]
categories = ["command-line-utilities", "multimedia"]
exclude = ["evidence/**", "landing/**"]
build = "build.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
