[package]
name = "vidcapture"
version = "0.1.0"
edition = "2024"
description = "CLI screen and audio recorder for macOS, with millisecond-precise cutting of existing recordings."
license = "MIT"
repository = "https://github.com/elvisbrevi/vidcapture"
authors = ["Elvis Brevi <elvisbrevi@gmail.com>"]
keywords = ["screen-recording", "ffmpeg", "macos", "cli", "video"]
categories = ["command-line-utilities", "multimedia"]
exclude = ["evidence/**"]
build = "build.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
